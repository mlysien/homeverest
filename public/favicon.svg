<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Letter H badge logo</title>
  <desc>A circular navy blue badge with a cream-colored serif letter H in the center, surrounded by a cream ring border.</desc>

  <style>
    .badge-outer { fill: #3a4e7a; }
    .badge-ring { fill: none; stroke: #e8dfc8; stroke-width: 18; }
    .letter-h { fill: #e8dfc8; font-family: 'Arial', 'Times New Roman', serif; font-size: 420px; font-weight: 400; }
  </style>

  <circle cx="340" cy="340" r="320" class="badge-outer"/>
  <circle cx="340" cy="340" r="295" class="badge-ring"/>
  <text x="340" y="480" class="letter-h" text-anchor="middle" dominant-baseline="auto">H</text>
</svg>